name: Discovery Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio fastapi httpx python-dateutil
        
    - name: Run Pytest Regression Suite
      # This runs the Phase 1-5 tests which include the eval harness (eval/run_eval.py via test_phase3.py)
      run: |
        python -m pytest tests/ -v
      env:
        # Provide dummy credentials for CI environment
        GROQ_API_KEY: "dummy-key"
        SUPABASE_URL: "https://dummy.supabase.co"
        SUPABASE_SERVICE_KEY: "dummy-service-key"
        API_SECRET_KEY: "test-secret-123"
        PYTHONPATH: "src"
